[project]
name = "warden-bot"
version = "0.2.0"
description = "Discord moderation, automod, ticketing, music, and trivia bot."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.7.1,<3.0",
    "python-dotenv>=1.2.2,<2.0",
    "aiosqlite>=0.22.1,<1.0",
    "aiohttp>=3.10,<4.0",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14,<0.17",
    "mypy>=1.13,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<1.5",
    "pytest-cov>=5.0,<8.0",
]

[project.urls]
Homepage = "https://github.com/HilthonTT/warden-bot"
Issues = "https://github.com/HilthonTT/warden-bot/issues"

[project.scripts]
warden-bot = "bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
    "ASYNC",# async pitfalls
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
namespace_packages = true
exclude = ['^src/__init__\.py$']
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["discord.*", "yt_dlp.*", "aiosqlite.*"]
ignore_missing_imports = true

# Editors (Pylance/pyright) need the same source root that ruff, mypy and
# pytest are already told about: the code lives in src/ but is imported as
# `core`, `cogs`, `data`, `services`. Without this, every test import shows
# as unresolved even though the suite runs.
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.coverage.run]
source = ["src"]
omit = ["src/bot.py"]
