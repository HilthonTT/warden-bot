name: Feature request
description: Suggest a command or behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the moderation or community need, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      placeholder: "/timeout @user 10m reason — applies a Discord timeout and logs it"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Moderation
        - Automod / honeypot
        - Tickets
        - Music
        - User info
        - Trivia
        - Deployment / ops
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
